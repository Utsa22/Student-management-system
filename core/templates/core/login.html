{% extends 'core/base.html' %}

{% block title %}
    Login | StudentMS
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>
        Login
    </h1>


    {% if form.errors %}

        <div class="error-box">

            <p>
                Invalid username or password.
                Please try again.
            </p>

        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}


        {{ form.as_p }}


        <button
            type="submit"
            class="btn"
        >
            Login
        </button>

    </form>


    <p>

        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>

    </p>

</div>

{% endblock %}
